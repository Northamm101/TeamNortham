<!-- Overall Lineup Rendering -->
<script>

(function () {
  "use strict";

  const container = document.getElementById(
    "overall-lineup-statistics-list"
  );

  const overall = window.TeamNorthamOverall;

  if (!container || !overall) {
    return;
  }

  const {
    sortedLineups,
    formatRecord,
    lineupName,
    normalizePhase,
    escapeHTML
  } = overall;

  const lineups = sortedLineups();

  /* ---------- Format Helpers ---------- */

  function signedNumber(number) {
    if (number > 0) {
      return `+${number}`;
    }

    return String(number);
  }

  function averageDifferential(lineup) {
    if (!lineup.scoredGames) {
      return "—";
    }

    const average =
      lineup.differential / lineup.scoredGames;

    return average > 0
      ? `+${average.toFixed(2)}`
      : average.toFixed(2);
  }

  function resultLabel(result) {
    if (result === "W") return "Win";
    if (result === "L") return "Loss";
    if (result === "T") return "Tie";

    return "Result";
  }

  function resultClass(result) {
    if (result === "W") return "weekly-result-win";
    if (result === "L") return "weekly-result-loss";
    if (result === "T") return "weekly-result-tie";

    return "";
  }

  function recordBox(label, record) {
    return `
      <div>
        <span>${escapeHTML(label)}</span>
        <strong>${formatRecord(record)}</strong>
      </div>
    `;
  }

  /* ---------- Individual Game Rows ---------- */

  function renderGames(games) {
    const sortedGames = [...games].sort(
      (a, b) => b.date.localeCompare(a.date)
    );

    return sortedGames.map((game) => {

      const hasScore =
        typeof game.teamScore === "number" &&
        typeof game.opponentScore === "number";

      const score = hasScore
        ? `${game.teamScore}-${game.opponentScore}`
        : "—";

      const endsText = Number.isInteger(game.ends)
        ? ` (${game.ends}e)`
        : "";

      const draw =
        game.draw === "early" ? "Early" :
        game.draw === "late" ? "Late" : "—";

      const phase =
        normalizePhase(game.phase) === "playoffs"
          ? "Playoffs"
          : "Regular Season";

      const opponent = game.opponent == null
        ? "Unknown"
        : String(game.opponent);

      const rockColor =
        game.rockColor || "—";

      const showRocks =
        rockColor !== "—";

      return `
        <div class="lineup-game-row">

          <div class="lineup-game-heading">
            <div>
              <span>
                ${escapeHTML(game.season)} •
                ${escapeHTML(
                  game.displayDate || game.date
                )}
              </span>

              <strong>
                vs Team ${escapeHTML(opponent)}
              </strong>

              <span>${phase}</span>
            </div>

            <span class="lineup-game-result ${resultClass(game.result)}">
              ${resultLabel(game.result)}
            </span>
          </div>

          <div class="lineup-game-details ${showRocks ? "lineup-game-details-with-rocks" : ""}">

            <div>
              <span>Score</span>
              <strong>${score}${endsText}</strong>
            </div>

            <div>
              <span>Draw</span>
              <strong>${draw}</strong>
            </div>

            <div>
              <span>Sheet</span>
              <strong>${escapeHTML(
                game.sheet ?? "—"
              )}</strong>
            </div>

            ${showRocks ? `
              <div>
                <span>Rocks</span>
                <strong>
                  ${escapeHTML(rockColor)}
                </strong>
              </div>
            ` : ""}

          </div>

        </div>
      `;
    }).join("");
  }

  /* ---------- Render Full Lineup Cards ---------- */

  if (lineups.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <p>No recorded lineups are available yet.</p>
      </div>
    `;

    return;
  }

  container.innerHTML = lineups.map(
    (lineup, index) => {

      const record = lineup.records.overall;

      return `
        <article class="dashboard-card lineup-statistics-card">

          <div class="card-heading">
            <div>
              <p class="card-label">
                Lineup ${index + 1}
              </p>

              <h2>
                ${escapeHTML(
                  lineupName(lineup.lineup)
                )}
              </h2>
            </div>

            <span class="lineup-record-bubble">
              ${formatRecord(record)}
            </span>
          </div>

          <!-- Main Summary -->
          <div class="lineup-summary-grid">

            <div>
              <span>Games</span>
              <strong>${record.gamesPlayed}</strong>
            </div>

            <div>
              <span>Points</span>
              <strong>${record.points}</strong>
            </div>

            <div>
              <span>For / Against</span>
              <strong>
                ${lineup.scoredGames
                  ? `${lineup.pointsFor} / ${lineup.pointsAgainst}`
                  : "—"}
              </strong>
            </div>

            <div>
              <span>Average Diff.</span>
              <strong>
                ${averageDifferential(lineup)}
              </strong>
            </div>

          </div>

          <!-- Season Phase Records -->
          <section class="lineup-breakdown-section">
            <h3>Season Performance</h3>

            <div class="lineup-sheet-grid">

              ${recordBox(
                "Overall",
                lineup.records.overall
              )}

              ${recordBox(
                "Regular",
                lineup.records.regular
              )}

              ${recordBox(
                "Playoffs",
                lineup.records.playoffs
              )}

            </div>
          </section>

          <!-- Draw Performance -->
          <section class="lineup-breakdown-section">
            <h3>Draw Performance</h3>

            <div class="lineup-two-column-grid">

              ${recordBox(
                "Early Draw",
                lineup.draws.early.overall
              )}

              ${recordBox(
                "Late Draw",
                lineup.draws.late.overall
              )}

            </div>
          </section>

          <!-- Sheet Performance -->
          <section class="lineup-breakdown-section">
            <h3>Sheet Performance</h3>

            <div class="lineup-sheet-grid">

              ${[1, 2, 3].map((sheet) => {
                return recordBox(
                  `Sheet ${sheet}`,
                  lineup.sheets[sheet].overall
                );
              }).join("")}

            </div>
          </section>

          <!-- Individual Games -->
          <section class="lineup-breakdown-section">
            <h3>Games Played</h3>

            <div class="lineup-games-list">
              ${renderGames(lineup.games)}
            </div>
          </section>

        </article>
      `;
    }
  ).join("");

})();

</script>
